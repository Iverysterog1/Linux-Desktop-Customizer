name: Validate historical beta blob archive

on:
  pull_request:
    paths:
      - 'scripts/validate_historical_beta_blobs.sh'
      - '.github/workflows/validate-historical-beta-blobs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Reconstruct, hash-check, test and build preserved beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/validate_historical_beta_blobs.sh
