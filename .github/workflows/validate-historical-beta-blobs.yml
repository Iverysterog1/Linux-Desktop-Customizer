name: Validate historical beta blob archive

on:
  pull_request:
    paths:
      - 'scripts/validate_historical_beta_blobs.sh'
      - '.github/workflows/validate-historical-beta-blobs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Reconstruct, hash-check, test and build preserved beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          bash scripts/validate_historical_beta_blobs.sh 2>&1 | tee historical-beta-validation.log
      - name: Preserve validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-beta-validation-${{ github.run_id }}
          path: historical-beta-validation.log
          if-no-files-found: error
          retention-days: 7
