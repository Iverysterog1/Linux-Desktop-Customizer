name: Canonical CI

on:
  pull_request:
    branches: [integration/canonical, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Canonical CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.x'

      - name: Unit and integration tests
        run: go test ./... -count=1

      - name: Static analysis
        run: go vet ./...

      - name: Race detector
        run: go test -race ./... -count=1

      - name: Build CLI and UI
        run: |
          set -euo pipefail
          go build -trimpath -o /tmp/ltc ./cmd/ltc
          go build -trimpath -o /tmp/ltc-ui ./cmd/ltc-ui
          /tmp/ltc version
          /tmp/ltc-ui

      - name: Installer and desktop integration checks
        run: |
          set -euo pipefail
          bash -n packaging/install-user.sh packaging/uninstall-user.sh scripts/test-install-user.sh scripts/validate-desktop-entry.sh
          bash scripts/validate-desktop-entry.sh
          bash scripts/test-install-user.sh

      - name: Repository diff check
        run: git diff --check
