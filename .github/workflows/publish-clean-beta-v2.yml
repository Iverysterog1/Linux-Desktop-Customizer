name: Publish clean beta source v2 (disabled legacy publisher)

# SECURITY: This legacy workflow previously had contents: write and force-pushed
# a reconstructed tree directly to main. It is intentionally retained as an
# inert audit marker while consolidation is in progress.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy publisher is disabled
        shell: bash
        run: |
          set -euo pipefail
          echo 'PASS: legacy publish-clean-beta-v2 direct/force-write path is disabled.'
          echo 'Publication must use the reviewed canonical integration and release gates.'
