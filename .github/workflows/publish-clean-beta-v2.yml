name: Publish clean beta source v2 (disabled legacy workflow)

# SECURITY: This legacy recovery/publishing workflow previously had contents: write
# and force-pushed a reconstructed tree directly to refs/heads/main when
# beta-archive/READY2 changed. It is intentionally manual and read-only now.
# Keep it only as historical documentation until the recovery pipeline is
# replaced with a PR-based, hash-verified workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy publisher is disabled
        shell: bash
        run: |
          echo 'This legacy publisher is disabled for security.'
          echo 'Use a dedicated branch + pull request + required CI for source recovery.'
          exit 0
