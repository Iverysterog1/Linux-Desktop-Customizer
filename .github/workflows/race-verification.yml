name: Race detector verification (retired publisher)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Run Go race detector
        run: go test -race ./...
      - name: Verify workflow remains read-only
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/race-verification.yml'
          forbidden='contents:[[:space:]]*write|actions:[[:space:]]*write|git[[:space:]]+push|--force|GH_TOKEN|GITHUB_TOKEN|git[[:space:]]+commit|publication-race/READY|branches:[[:space:]]*\[main\]'
          if grep -En -- "$forbidden" "$workflow"; then
            echo 'ERROR: privileged publication primitive reintroduced into race verification workflow.' >&2
            exit 1
          fi
          echo 'PASS: race verification workflow is read-only and has no direct publication path.'
