name: Race detector verification

on:
  workflow_dispatch:
  pull_request:
    branches: [integration/canonical]

permissions:
  contents: read

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.23.x'
      - name: Run Go race detector
        run: go test -race ./...
      - name: Verify workflow remains read-only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)" || {
            echo 'Race verification modified the checkout unexpectedly.' >&2
            git status --short >&2
            exit 1
          }
