name: Workflow security regression guard

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/check-workflow-write-regressions.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect changed workflows
        shell: bash
        run: bash .github/scripts/check-workflow-write-regressions.sh origin/${{ github.base_ref || 'main' }}
