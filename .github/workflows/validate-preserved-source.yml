name: Validate preserved source package

on:
  pull_request:
    paths:
      - 'scripts/validate_preserved_source.sh'
      - '.github/workflows/validate-preserved-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validation branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pinned preserved-source commit
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin 80270fe4e7d9f01f2e4438e9d7c2bc1658088b8e
          git cat-file -e 80270fe4e7d9f01f2e4438e9d7c2bc1658088b8e^{commit}

      - name: Strictly validate archive and recovered source
        run: bash scripts/validate_preserved_source.sh
