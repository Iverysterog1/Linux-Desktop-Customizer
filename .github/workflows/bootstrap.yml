name: Bootstrap source

on:
  push:
    paths:
      - 'bootstrap/**'

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand reviewed source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ldc-source
          cat bootstrap/source.part.*.b64 | base64 --decode > /tmp/ldc-source.tar.gz
          tar -xzf /tmp/ldc-source.tar.gz -C /tmp/ldc-source
          cp -a /tmp/ldc-source/. .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit reviewed source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Linux Desktop Customizer 0.9.0 source'
          git push
