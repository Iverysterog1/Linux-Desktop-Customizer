name: Bootstrap source

on:
  push:
    paths:
      - 'bootstrap/READY'

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand reviewed source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ldc-source
          cat bootstrap/payload.part.*.b64 | base64 --decode > /tmp/ldc-source.tar.xz
          echo '3146a1e26e91f23cc8fb333e74a904b4b05b9c624e26cc0837d1a414d446eb36  /tmp/ldc-source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/ldc-source.tar.xz -C /tmp/ldc-source
          cp -a /tmp/ldc-source/. .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit reviewed source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Linux Desktop Customizer 0.9.0 source'
          git push
