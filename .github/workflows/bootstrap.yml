name: Finalize repository import

on:
  push:
    paths:
      - 'import-parts/READY'

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-assets.txt
      - name: Verify and reconstruct reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          cat import-parts/part-*.patch > /tmp/ldc-source.patch
          echo 'c1c968a9f027c6d2672cedb1d680fef55950cdff062bf02dbaed0dfca717c57b  /tmp/ldc-source.patch' | sha256sum -c -
      - name: Build a clean source tree
        shell: bash
        run: |
          set -euo pipefail
          git checkout --orphan clean-main
          git rm -rf .
          git clean -fdx
          git apply --index /tmp/ldc-source.patch
      - name: Materialize complete official themes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-assets.txt
          python scripts/generate_signature_themes.py
          mkdir -p assets/theme-previews
          for slug in fire water wind earth mac-inspired windows-inspired; do
            cp "themes/official/$slug/preview.png" "assets/theme-previews/$slug.png"
          done
          git add themes/official assets/theme-previews
      - name: Validate complete repository
        shell: bash
        run: |
          set -euo pipefail
          go test ./... -count=1
          go vet ./...
          go build ./cmd/ltc
          go build ./cmd/ltc-ui
          bash -n packaging/install-user.sh packaging/uninstall-user.sh
          git diff --cached --check
      - name: Publish clean main history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'JP99'
          git config user.email '314643088+Iverysterog1@users.noreply.github.com'
          git commit -m 'Initial public release: Linux Desktop Customizer 0.9.0'
          git push --force origin clean-main:main
          sleep 5
          gh workflow run ci.yml --ref main --repo "$GITHUB_REPOSITORY" || true
