name: Bootstrap source

on:
  push:
    paths:
      - 'bootstrap/READY'

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct reviewed source tree from readable Git patches
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/patches/source-*.patch > /tmp/linux-desktop-customizer.patch
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          git apply --binary /tmp/linux-desktop-customizer.patch
      - name: Materialize all official theme assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-assets.txt
          python scripts/generate_signature_themes.py
          mkdir -p assets/theme-previews
          for slug in fire water wind earth mac-inspired windows-inspired; do
            cp "themes/official/$slug/preview.png" "assets/theme-previews/$slug.png"
          done
      - name: Finalize public README
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          start = s.index('<!-- PREVIEWS_PENDING -->')
          end = s.index('<!-- /PREVIEWS_PENDING -->') + len('<!-- /PREVIEWS_PENDING -->')
          previews = '''| Fire | Water | Wind |
          |---|---|---|
          | ![Fire](assets/theme-previews/fire.png) | ![Water](assets/theme-previews/water.png) | ![Wind](assets/theme-previews/wind.png) |

          | Earth | Mac Inspired | Windows Inspired |
          |---|---|---|
          | ![Earth](assets/theme-previews/earth.png) | ![Mac Inspired](assets/theme-previews/mac-inspired.png) | ![Windows Inspired](assets/theme-previews/windows-inspired.png) |'''
          previews = '\n'.join(line.strip() for line in previews.splitlines())
          s = s[:start] + previews + s[end:]
          s = s.replace(
              'The official theme tree is reproducible from `scripts/generate_signature_themes.py` and repository-owned design definitions.\n\nA clean regeneration was checked against the supplied `0.9.0-visual-composer` source package: all **379 generated files** were recreated with the same paths and SHA-256 hashes.\n\nGitHub Actions regenerates the payload before tests and before packaging Linux releases.',
              'The repository includes the complete `themes/official/` tree together with the generator and repository-owned design definitions. A clone therefore contains the source code **and** all current official theme assets.\n\nThe assets remain reproducible through `scripts/generate_signature_themes.py`. A clean regeneration was checked against the supplied `0.9.0-visual-composer` source package: all **379 generated files** were recreated with the same paths and SHA-256 hashes.\n\nGitHub Actions regenerates the payload during testing and before packaging Linux releases so generated assets stay verifiable.'
          )
          p.write_text(s)
          PY
      - name: Validate complete public tree
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          go build ./cmd/ltc
          go build ./cmd/ltc-ui
          git diff --check
      - name: Publish one clean main commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JP99'
          git config user.email 'sousa.clerigo@gmail.com'
          git checkout --orphan public-main
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -A
          git add -f themes/official assets/theme-previews
          git commit -m 'Initial public release: Linux Desktop Customizer 0.9.0'
          git push --force origin public-main:main
