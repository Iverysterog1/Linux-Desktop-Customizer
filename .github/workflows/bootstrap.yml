name: Retired legacy repository bootstrap publisher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Legacy bootstrap publication path is disabled
        shell: bash
        run: |
          set -euo pipefail
          echo 'This legacy repository bootstrap publisher is intentionally retired.'
          echo 'It must not reconstruct or publish directly to the default branch.'
          echo 'Source changes must use the canonical development line, validation, and reviewed pull requests.'
