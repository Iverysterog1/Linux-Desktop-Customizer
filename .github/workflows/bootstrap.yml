name: Legacy repository import (disabled)

# SECURITY: This historical bootstrap workflow previously ran on a normal push,
# held repository write permissions, created an orphan history, and force-pushed
# it over main. Keep the workflow only as an auditable tombstone. Any future
# source recovery must happen on a dedicated branch and be reviewed through a PR.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain safe recovery path
        shell: bash
        run: |
          cat <<'EOF'
          This legacy repository-import publisher is intentionally disabled.

          Safe recovery requirements:
            1. reconstruct and verify source without mutating main;
            2. commit recovered source to a dedicated branch;
            3. run required tests and build validation;
            4. review and merge through a pull request.

          This workflow has no repository write permission and performs no push.
          EOF
