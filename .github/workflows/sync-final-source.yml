name: Retired final source sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Explain safe recovery path
        shell: bash
        run: |
          set -euo pipefail
          echo 'This legacy direct-to-main source sync is retired.'
          echo 'Source recovery must happen on a dedicated branch, pass validation, and be reviewed through a pull request.'

      - name: Regression guard for retired publisher
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/sync-final-source.yml'
          forbidden='contents: write|actions: write|git[[:space:]]+push|--force|GH_TOKEN|source-import-2'
          if grep -En -- "$forbidden" "$workflow"; then
            echo 'ERROR: retired workflow regained a write/publication primitive' >&2
            exit 1
          fi
          echo 'PASS: workflow remains manual, read-only, and non-publishing'
