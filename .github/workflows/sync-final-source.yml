# SECURITY: RETIRED LEGACY WORKFLOW
#
# The former job committed generated/recovered repository state and pushed it
# directly to main with a write-capable GITHUB_TOKEN. Repository changes must
# instead be reviewed through a pull request.
name: Retired - Final source sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: |
          echo 'This legacy direct-to-main sync workflow is retired.'
          echo 'Prepare changes on a dedicated branch and open a pull request.'
