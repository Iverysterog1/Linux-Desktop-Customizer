name: Publish clean beta source (disabled legacy workflow)

# SECURITY: This historical publisher previously ran on a normal push,
# granted contents: write, reconstructed a source tree, and force-pushed it
# directly over main. It is retained only as an auditable tombstone.
# Source recovery must use a dedicated branch, validation, and pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain safe recovery path
        shell: bash
        run: |
          set -Eeuo pipefail
          cat <<'EOF'
          This legacy clean-beta publisher is intentionally disabled.

          Safe recovery requirements:
            1. reconstruct source without mutating main;
            2. verify archive integrity and provenance;
            3. commit recovered source to a dedicated branch;
            4. run required tests/build/package validation;
            5. review changes through a pull request.

          This workflow has read-only repository permission and performs no push,
          release, tag, package publication, or repository-content mutation.
          EOF
