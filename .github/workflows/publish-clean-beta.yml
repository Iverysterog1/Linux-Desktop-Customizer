name: Publish clean beta source

on:
  push:
    paths:
      - 'beta-archive/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct reviewed beta archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/ldc-beta.tar.xz
          fetch_blob() {
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$1" --jq .content | tr -d '\n' | base64 -d >> /tmp/ldc-beta.tar.xz
          }
          fetch_blob 617acebce23f59124269e03c65f0fd6bb3b1be70
          fetch_blob cf03a0e7202be9a3f0b7897a704b4087c9814719
          fetch_blob 673858ea8028133c68dd700c824cf22d610184a4
