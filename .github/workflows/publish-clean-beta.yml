          fetch_blob 1288218f609b9434f1c177bd9c3b1b0d867b60da
          fetch_blob 4e63304fd7f0359fc6520023a96d8ef8f58e4455
          fetch_blob 7460c60ac89de3842808a3bc5e99ccde72898b37
          echo 'c1e95430c5fe2bba0259216240c8d056686f74ba09b9f1607ea5d8e33af6fce5  /tmp/ldc-beta.tar.xz' | sha256sum -c -
          mkdir -p /tmp/ldc-source
          tar -xJf /tmp/ldc-beta.tar.xz -C /tmp/ldc-source
          test "$(cat /tmp/ldc-source/VERSION)" = '0.9.0-beta.1'

      - name: Replace workspace with clean source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/ldc-source/. .

      - name: Verify clean repository layout
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = '0.9.0-beta.1'
          for p in bootstrap import-parts import-tunnel publication-check publication-race release-trigger beta-source beta-archive final-sync; do
            test ! -e "$p"
          done
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/workflows.txt
          printf 'build-linux.yml\nci.yml\n' | diff -u - /tmp/workflows.txt
          for p in earth fire mac-inspired water wind windows-inspired; do
            test -f "assets/theme-previews/$p.svg"
          done
          ! grep -R 'JP99/Linux-Desktop-Customizer' -n --exclude-dir=.git .

      - name: Install asset dependencies
        run: python3 -m pip install -r requirements-assets.txt

      - name: Generate official themes
        run: python3 scripts/generate_signature_themes.py

      - name: Unit and integration tests
        run: go test ./... -count=1

      - name: Vet
        run: go vet ./...

      - name: Race detector
        run: go test -race ./... -count=1

      - name: Build binaries
        run: |
          go build -o /tmp/ltc ./cmd/ltc
          go build -o /tmp/ltc-ui ./cmd/ltc-ui

      - name: Validate shell scripts
        run: |
          bash -n packaging/linux/install-user.sh
          bash -n packaging/linux/uninstall-user.sh

      - name: Final source checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -d themes/official
          test "$(find themes/official -type f | wc -l)" -ge 379
          rm -rf themes/official bin dist

      - name: Publish one clean root commit to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JP99'
          git config user.email 'sousa.clerigo@gmail.com'
          git add -A
          TREE="$(git write-tree)"
          COMMIT="$(printf '%s\n' 'Prepare 0.9.0-beta.1 public beta' | git commit-tree "$TREE")"
          git push --force origin "$COMMIT:refs/heads/main"
          echo "Published clean main at $COMMIT"
