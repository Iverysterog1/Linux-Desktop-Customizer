name: Validate historical beta recovery status

on:
  pull_request:
    paths:
      - 'scripts/validate-historical-beta-blob-archive.sh'
      - '.github/workflows/validate-historical-beta-blob-archive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: bash scripts/validate-historical-beta-blob-archive.sh
