name: Finalize beta source (legacy disabled)

# SECURITY: This legacy publisher previously reconstructed an orphan tree and
# force-pushed it directly to main with contents: write. It is retained only as
# an inert historical marker while canonical consolidation is in progress.
# Publication must go through reviewed, protected repository processes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy publisher is disabled
        shell: bash
        run: |
          set -euo pipefail
          echo 'Legacy finalize-beta publisher disabled: no repository writes or publication are performed.'
