name: Finalize beta source (legacy validation only)

# SECURITY: This legacy workflow previously force-pushed an orphan commit to
# main when beta-import/READY changed. Keep it manual/read-only so historical
# validation remains available without granting a workflow a direct-write path.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-safety-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify legacy publisher stays non-writing
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/finalize-beta.yml'
          ! grep -Eq 'contents:[[:space:]]*write' "$workflow"
          ! grep -Eq 'git[[:space:]]+push' "$workflow"
          ! grep -Eq -- '--force' "$workflow"
          ! grep -Eq 'clean-main:main' "$workflow"
          echo 'Legacy finalize workflow is read-only and cannot publish to main.'
