name: Retired main writers guard

on:
  pull_request:
    paths:
      - '.github/workflows/finalize-reviewed-source.yml'
      - '.github/workflows/sync-final-source.yml'
      - '.github/workflows/tag-v0.9.0.yml'
      - '.github/scripts/check-retired-main-writers.sh'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: bash .github/scripts/check-retired-main-writers.sh
