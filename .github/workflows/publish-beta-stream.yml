# retained only as an inert historical marker during consolidation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm legacy publisher is disabled
        shell: bash
        run: |
          set -euo pipefail
          echo 'Legacy beta stream publisher is disabled.'
          echo 'Publication must use the reviewed canonical release process.'
