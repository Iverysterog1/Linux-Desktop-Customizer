name: Retired beta stream publisher

# SECURITY: Historical publication workflow retained only as an auditable tombstone.
# Source recovery and publication must use a dedicated branch, validation, review,
# and an explicit pull request. This workflow must never publish to main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Explain retired publication path
        shell: bash
        run: |
          set -euo pipefail
          echo 'Legacy beta-stream publication is retired.'
          echo 'Recover source on a dedicated branch, validate it, and submit a pull request.'

      - name: Fail closed if publication primitives return
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/publish-beta-stream.yml'
          ! grep -Eq 'contents:[[:space:]]*write|actions:[[:space:]]*write' "$workflow"
          ! grep -Eq 'git[[:space:]]+push|--force|GH_TOKEN|beta-main:main' "$workflow"
          ! grep -Eq 'pip[[:space:]]+install|curl[[:space:]]|wget[[:space:]]' "$workflow"
