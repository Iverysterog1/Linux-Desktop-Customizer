name: Retired v0.9.0 tag publisher

# SECURITY: This legacy release workflow is intentionally inert.
# Releases and tags must be prepared on a reviewed branch, validated by CI,
# and published only through an explicitly reviewed release process.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Explain retirement
        shell: bash
        run: |
          set -euo pipefail
          echo 'Legacy v0.9.0 automatic publication is retired.'
          echo 'This workflow has read-only repository access and performs no publication.'
          echo 'Use a reviewed branch, required validation, and an explicit release process.'
