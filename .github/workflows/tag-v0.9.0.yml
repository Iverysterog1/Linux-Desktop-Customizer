name: Retired legacy v0.9.0 tag publisher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Legacy tag publication is disabled
        run: |
          echo 'This workflow cannot modify the repository or publish tags.'
          echo 'Release publication requires a separately reviewed and explicitly authorized process.'
