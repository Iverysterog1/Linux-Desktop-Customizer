# SECURITY: RETIRED LEGACY WORKFLOW
#
# The former release helper modified main directly and created/pushed a tag
# using contents:write. Release preparation must go through a reviewed PR and
# release/tag publication must be an explicit, separately authorized action.
name: Retired - Guarded v0.9.0 tag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: |
          echo 'This legacy direct-write/tag workflow is retired.'
          echo 'Use reviewed pull requests and an explicit release process.'
