name: Retired v0.9.0 tag publisher

# SECURITY: This legacy release workflow is intentionally inert.
# Releases and tags must be prepared on a reviewed branch, validated by CI,
# and published only through an explicitly reviewed release process.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Explain retirement
        shell: bash
        run: |
          set -euo pipefail
          echo 'Legacy v0.9.0 automatic tagging is retired.'
          echo 'Do not write to main or create/push tags from this workflow.'
          echo 'Use a reviewed branch, required validation, and an explicit release process.'

      - name: Fail closed if publication primitives return
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/tag-v0.9.0.yml'
          forbidden=(
            'contents: write'
            'actions: write'
            'git push'
            'git tag'
            'GH_TOKEN'
            'GITHUB_TOKEN'
            'refs/heads/main'
            'origin main'
            'release-trigger/READY'
          )
          for pattern in "${forbidden[@]}"; do
            if grep -Fq -- "$pattern" "$workflow"; then
              echo "Forbidden publication primitive found: $pattern" >&2
              exit 1
            fi
          done
