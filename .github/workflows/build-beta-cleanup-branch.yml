name: Legacy beta cleanup publisher (disabled)

# SECURITY: This historical workflow previously reconstructed repository content
# and force-pushed a generated commit to beta-cleanup with a write-capable
# GITHUB_TOKEN. It is retained only as an inert historical marker while the
# repository is consolidated. Publication must be re-designed behind reviewed,
# least-privilege controls rather than re-enabling this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm legacy publisher is disabled
        shell: bash
        run: |
          set -euo pipefail
          echo 'Legacy beta cleanup publisher is disabled.'
          echo 'No repository write token, reconstruction, commit, or push is performed.'
