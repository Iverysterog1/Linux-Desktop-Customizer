name: Retired beta cleanup branch publisher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Explain safe recovery path
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'This legacy publisher is retired.'
          echo 'Source recovery must occur on a dedicated branch, pass validation, and be reviewed through a pull request.'
      - name: Regression guard
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow='.github/workflows/build-beta-cleanup-branch.yml'
          ! grep -Eq 'contents:[[:space:]]*write|actions:[[:space:]]*write' "$workflow"
          ! grep -Eq 'git[[:space:]]+push|--force|GH_TOKEN|commit-tree|write-tree' "$workflow"
          ! grep -Eq 'pip[[:space:]]+install|curl|wget|gh[[:space:]]+api' "$workflow"
