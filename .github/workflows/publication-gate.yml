name: Retired publication verification gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Explain reviewed publication path
        shell: bash
        run: |
          set -euo pipefail
          echo 'This legacy publication workflow is retired.'
          echo 'Release-quality verification must run read-only on a dedicated branch/PR.'
          echo 'Any resulting status/documentation change must be reviewed and merged through the normal protected PR path.'

      - name: Fail closed if publication authority is reintroduced
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/publication-gate.yml'
          ! grep -Eq 'contents:[[:space:]]*write|actions:[[:space:]]*write' "$workflow"
          ! grep -Eq 'git[[:space:]]+push|--force|GH_TOKEN|GITHUB_TOKEN' "$workflow"
          ! grep -Eq 'branches:[[:space:]]*\[?main|git[[:space:]]+commit|Record publication verification' "$workflow"
          echo 'PASS: retired workflow remains read-only and cannot publish to main.'
