name: Retired publication verification gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain safe replacement
        shell: bash
        run: |
          set -euo pipefail
          echo 'This legacy publication gate is retired.'
          echo 'Validation must run on a dedicated branch and report results through a reviewed pull request.'
          echo 'No workflow may commit or push directly to main.'
          echo 'Release or publication requires a separate explicit authorization after canonical source recovery and CI validation.'
