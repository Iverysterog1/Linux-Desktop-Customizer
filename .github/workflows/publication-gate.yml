name: Publication verification gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # SECURITY: pin third-party Actions to immutable commit SHAs. Mutable
      # major-version tags can move and are not a sufficient trust boundary.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.x'

      - name: Verify clean repository shape
        shell: bash
        run: |
          set -euo pipefail
          test -f go.mod
          test -f cmd/ltc/main.go
          test -f cmd/ltc-ui/main.go
          test -f LICENSE
          test -f README.md
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f docs/VALIDATION.md
          for slug in fire water wind earth mac-inspired windows-inspired; do
            test -f "assets/theme-previews/$slug.png"
            test -f "themes/official/$slug/preview.png"
          done
          test ! -e bootstrap
          test ! -e import-bin
          test ! -e import-parts
          test ! -e import-tunnel
          test ! -e final-sync
          grep -q 'assets/theme-previews/fire.png' README.md
          grep -q 'assets/theme-previews/windows-inspired.png' README.md

      - name: Run release-quality checks
        shell: bash
        run: |
          set -euo pipefail
          go test ./... -count=1
          go vet ./...
          go build ./cmd/ltc
          go build ./cmd/ltc-ui
          bash -n packaging/install-user.sh packaging/uninstall-user.sh
          git diff --check

      - name: Verify validation is read-only
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo 'Publication verification unexpectedly modified tracked files.' >&2
            git status --short >&2
            exit 1
          fi
          if test -n "$(git ls-files --others --exclude-standard)"; then
            echo 'Publication verification unexpectedly created untracked files.' >&2
            git status --short >&2
            exit 1
          fi
          echo 'Publication verification passed without modifying the repository.'
