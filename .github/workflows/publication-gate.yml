name: Publication verification gate (read-only)

# SECURITY: This legacy publication gate previously committed verification output
# directly to the default branch. It is intentionally retained only as an on-demand verifier.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Verify clean repository shape
        shell: bash
        run: |
          set -euo pipefail
          test -f go.mod
          test -f cmd/ltc/main.go
          test -f cmd/ltc-ui/main.go
          test -f LICENSE
          test -f README.md
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f docs/VALIDATION.md
          for slug in fire water wind earth mac-inspired windows-inspired; do
            test -f "assets/theme-previews/$slug.png"
            test -f "themes/official/$slug/preview.png"
          done
          test ! -e bootstrap
          test ! -e import-bin
          test ! -e import-parts
          test ! -e import-tunnel
          test ! -e final-sync
          grep -q 'assets/theme-previews/fire.png' README.md
          grep -q 'assets/theme-previews/windows-inspired.png' README.md

      - name: Run release-quality checks
        shell: bash
        run: |
          set -euo pipefail
          go test ./... -count=1
          go vet ./...
          go build ./cmd/ltc
          go build ./cmd/ltc-ui
          bash -n packaging/install-user.sh packaging/uninstall-user.sh
          git diff --check

      - name: Assert workflow remains read-only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --porcelain)" = ""
          echo 'PASS: verification completed without modifying the checkout.'
