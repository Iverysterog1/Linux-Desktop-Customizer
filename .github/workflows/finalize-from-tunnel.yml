name: Audit legacy tunnel publication workflow

# SECURITY: This legacy workflow previously downloaded source from an external
# tunnel and force-pushed an orphan commit directly to main. It is intentionally
# retained only as a manual, read-only audit guard until the legacy path is
# removed entirely.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-disabled-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify legacy publication path remains disabled
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/finalize-from-tunnel.yml'

          # Fail closed if write permission, network retrieval, or publication
          # commands are ever reintroduced into this retired workflow.
          if grep -Eq 'contents:[[:space:]]*write|curl[[:space:]]|wget[[:space:]]|git[[:space:]]+push|--force|clean-main:main' "$workflow"; then
            echo 'ERROR: retired tunnel publication capability was reintroduced' >&2
            exit 1
          fi

          echo 'PASS: legacy tunnel publication path is manual and read-only'
