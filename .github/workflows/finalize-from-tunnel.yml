name: Finalize reviewed repository (legacy disabled)

# SECURITY: This legacy publisher previously downloaded an archive from an
# external tunnel and force-pushed an orphan commit directly to main.
# It is retained only as an inert historical marker during consolidation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy publisher disabled
        shell: bash
        run: |
          set -euo pipefail
          echo 'Legacy finalize-from-tunnel publisher is disabled.'
          echo 'No external source is downloaded and no repository ref is written.'
