name: Cleanup temporary import branch

on:
  push:
    branches: [main]
    paths: ['cleanup-import/READY']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete temporary source branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete source-import-2 || true
      - name: Remove cleanup scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cleanup-import
          rm -f .github/workflows/cleanup-import-branch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary import branch scaffolding'
          git push origin main
