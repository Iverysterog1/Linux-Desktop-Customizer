name: Recover current source package (retired publisher)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Explain safe recovery path
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'Legacy recovered-source publication is retired.'
          echo 'Recovery must validate immutable inputs in a read-only job, then use a dedicated branch and reviewed pull request.'

      - name: Fail closed if privileged publication primitives return
        shell: bash
        run: |
          set -Eeuo pipefail
          file='.github/workflows/recover-current-source.yml'
          ! grep -Eq 'contents:[[:space:]]*write|actions:[[:space:]]*write' "$file"
          ! grep -Eq 'git[[:space:]]+push|--force|refs/heads/recovered-source' "$file"
          ! grep -Eq 'GH_TOKEN|GITHUB_TOKEN|persist-credentials:[[:space:]]*true' "$file"
          ! grep -Eq 'git[[:space:]]+(commit-tree|write-tree|add)|Replace workspace with recovered source|Publish validated recovered source branch' "$file"
