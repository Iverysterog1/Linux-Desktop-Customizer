name: Recover current source package (read-only validation)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Reconstruct verified source package from Git history
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC_COMMIT='0e7bf56bfe90a583c6117b13e88ed8416b5cd564'
          git cat-file -e "${SRC_COMMIT}^{commit}"
          mkdir -p /tmp/ldc-source
          {
            for i in 00 01 02 03; do
              git show "${SRC_COMMIT}:bootstrap/payload.part.${i}.b64"
              printf '\n'
            done
            for i in 04 05 06 07 08 09 10 11; do
              git ls-tree -r --name-only "$SRC_COMMIT" bootstrap \
                | grep -E "^bootstrap/payload\.part\.${i}\.seg[^/]*\.b64$" \
                | sort \
                | while IFS= read -r f; do
                    git show "${SRC_COMMIT}:${f}" | sed '/^#/d'
                    printf '\n'
                  done
            done
          } | base64 --decode > /tmp/ldc-source.tar.xz
          echo '3146a1e26e91f23cc8fb333e74a904b4b05b9c624e26cc0837d1a414d446eb36  /tmp/ldc-source.tar.xz' | sha256sum -c -
          xz -t /tmp/ldc-source.tar.xz
          tar -xJf /tmp/ldc-source.tar.xz -C /tmp/ldc-source
          echo '=== recovered root ==='
          find /tmp/ldc-source -maxdepth 2 -type f | sort | head -160
          test -f /tmp/ldc-source/go.mod
          test -d /tmp/ldc-source/cmd
          test -d /tmp/ldc-source/internal

      - name: Validate recovered source without mutating repository checkout
        shell: bash
        working-directory: /tmp/ldc-source
        run: |
          set -Eeuo pipefail
          echo '=== version ==='
          cat VERSION
          echo '=== go test ==='
          go test ./... -count=1
          echo '=== go vet ==='
          go vet ./...
          echo '=== race ==='
          go test -race ./... -count=1
          echo '=== builds ==='
          go build -o /tmp/ltc ./cmd/ltc
          go build -o /tmp/ltc-ui ./cmd/ltc-ui
          echo '=== shell syntax ==='
          test ! -f packaging/linux/install-user.sh || bash -n packaging/linux/install-user.sh
          test ! -f packaging/linux/uninstall-user.sh || bash -n packaging/linux/uninstall-user.sh

      - name: Verify workflow remained read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(git status --porcelain)"
          test -z "$(git remote get-url --push origin 2>/dev/null || true)" || {
            echo 'Checkout exposes a push URL; credentials are disabled and no publication step is permitted.'
          }
          echo 'PASS: recovered source validated without repository mutation or publication.'
