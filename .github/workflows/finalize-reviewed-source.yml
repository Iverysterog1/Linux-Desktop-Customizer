name: Retired legacy reviewed-source publisher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Legacy publication path is disabled
        run: |
          echo 'This legacy workflow is intentionally retired.'
          echo 'Source changes must use a dedicated branch, validation, and a reviewed pull request.'
          echo 'Direct or force publication to the default branch is prohibited.'
