name: Retired finalize reviewed source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Explain safe recovery path
        run: |
          echo 'This legacy publisher is retired.'
          echo 'Reviewed source recovery must occur on a dedicated branch, pass validation, and be merged only through a reviewed pull request.'
      - name: Guard against dangerous publication primitives
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/finalize-reviewed-source.yml'
          if grep -En 'contents:[[:space:]]*write|git[[:space:]]+push|--force|clean-main|curl[[:space:]]|wget[[:space:]]|serveo\.net|GH_TOKEN|actions:[[:space:]]*write' "$workflow"; then
            echo 'ERROR: retired workflow contains a forbidden write, external-fetch, or force-publication primitive.' >&2
            exit 1
          fi
          echo 'PASS: retired workflow is read-only and contains no legacy publication primitive.'
