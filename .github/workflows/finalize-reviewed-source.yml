# SECURITY: RETIRED LEGACY WORKFLOW
#
# This file is intentionally inert. The former workflow downloaded an archive
# from a temporary external tunnel and then force-pushed an orphan commit over
# main using a contents:write GITHUB_TOKEN. Keeping that path executable would
# allow repository history and reviewed changes to be replaced outside the PR
# flow.
#
# Historical recovery should be performed on a dedicated branch, validated,
# and proposed through a pull request. Do not restore a push-to-main trigger,
# contents: write, or `git push --force ...:main` here.
name: Retired - Finalize reviewed source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: |
          echo 'This legacy source-finalization workflow is retired for security.'
          echo 'Use a dedicated recovery branch and pull request instead.'
